[package]
name = "tunelock"
version = "0.1.0"
description = "TuneLock — fast, accurate musical key + BPM analysis for producers and DJs"
edition = "2021"
rust-version = "1.70"
default-run = "tunelock"

[lib]
name = "tunelock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio processing
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "pcm", "aac", "alac", "isomp4", "aiff"] }
rustfft = "6.1"
ndarray = { version = "0.15", features = ["rayon"] }

# Real-time audio engine (Transition Workbench)
cpal = "0.15"
rtrb = "0.3"                             # Lock-free SPSC ring buffer for real-time audio
crossbeam-queue = "0.3"                  # Lock-free bounded queue for commands
rubato = "0.15"                          # Band-limited resampling
signalsmith-stretch = "0.1"              # PB-2: pitch-preserving time stretch (MIT, C++ via bindgen)

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# Parallel processing
rayon = "1.7"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Audio metadata
lofty = "0.19"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
csv = "1.3"
sha2 = "0.10"

# Optional asynchronous neural-key runtime. ONNX Runtime is supplied as an
# external sidecar/dylib; the default build downloads and bundles nothing.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic"] }

# Assist layer (LLM via Ollama — runtime feature flag, not compile-time)
reqwest = { version = "0.12", features = ["json"], default-features = false }

[features]
default = []
neural-key = ["dep:ort"]

[[bin]]
name = "tunelock-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "tunelock-key-bakeoff"
path = "src/bin/key_bakeoff.rs"

[[bin]]
name = "tunelock-key-corpus-manifest"
path = "src/bin/key_corpus_manifest.rs"

[[bin]]
name = "tunelock-neural-key-probe"
path = "src/bin/neural_key_probe.rs"
required-features = ["neural-key"]

[[bin]]
name = "tunelock-neural-key-parity"
path = "src/bin/neural_key_parity.rs"
required-features = ["neural-key"]

[[bin]]
name = "tunelock-neural-corpus-bench"
path = "src/bin/neural_corpus_bench.rs"
required-features = ["neural-key"]

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"
